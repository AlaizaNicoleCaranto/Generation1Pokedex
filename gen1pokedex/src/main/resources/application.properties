# Application name - identifies your Spring Boot application
spring.application.name=gen1pokedex

# Database connection URL with all required parameters
# allowPublicKeyRetrieval=true - fixes MySQL 8 authentication issue
# useSSL=false - disables SSL for local development
# serverTimezone=UTC - ensures consistent timezone handling
spring.datasource.url=jdbc:mysql://localhost:3306/gen1pokedex_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# Database credentials - username for MySQL connection
spring.datasource.username=root

# Database credentials - password for MySQL connection
spring.datasource.password=GhostlyRogue_09

# JPA / Hibernate configuration
# ddl-auto=update - automatically updates database schema based on entity changes
spring.jpa.hibernate.ddl-auto=update

# show-sql=true - prints SQL statements to console for debugging
spring.jpa.show-sql=true

# format_sql=true - makes printed SQL statements readable with line breaks
spring.jpa.properties.hibernate.format_sql=true

# Server port - application will run on http://localhost:8080
server.port=8080

# Seeding configuration - controls initial data loading
# enabled=true - automatically seeds database with Gen1 Pokemon on first run
app.seed.enabled=true

# source - PokeAPI endpoint for fetching Gen1 Pokemon data (first 151 Pokemon)
app.seed.source=https://pokeapi.co/api/v2/pokemon?limit=151